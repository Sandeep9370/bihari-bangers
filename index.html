<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Beat Wave Radio</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:'Poppins',sans-serif;
    }

    body{
      height:100vh;
      overflow:hidden;
      color:white;
    }

    /* Full screen background */
    .bg{
      position:fixed;
      inset:0;
      background:url("background.png") center center / cover no-repeat;
      z-index:-1;
    }

    .player{
      width:100%;
      height:100%;
    }

    /* Playlist button */
    .playlist-toggle{
      position:fixed;
      top:24px;
      right:24px;
      width:48px;
      height:48px;
      border:none;
      border-radius:50%;
      background:rgba(0,0,0,.55);
      color:white;
      font-size:20px;
      cursor:pointer;
      backdrop-filter:blur(6px);
    }

    /* Playlist panel */
    .playlist-panel{
      position:fixed;
      top:80px;
      right:24px;
      width:280px;
      max-height:70vh;
      overflow:auto;
      background:rgba(0,0,0,.7);
      border:1px solid rgba(255,255,255,.12);
      border-radius:18px;
      padding:14px;
      display:none;
    }

    .playlist-panel.open{
      display:block;
    }

    .song{
      padding:12px;
      border-radius:12px;
      cursor:pointer;
      margin-bottom:8px;
    }

    .song:hover{
      background:rgba(255,255,255,.08);
    }

    .song.active{
      background:rgba(249,115,22,.25);
    }

    /* Small bottom-center player */
    .mini-player{
      position:fixed;
      left:50%;
      bottom:28px;
      transform:translateX(-50%);
      display:flex;
      align-items:center;
      gap:12px;
      background:rgba(0,0,0,.55);
      border:1px solid rgba(255,255,255,.15);
      border-radius:999px;
      padding:10px 16px;
      backdrop-filter:blur(6px);
    }

    .btn{
      width:40px;
      height:40px;
      border:none;
      border-radius:50%;
      background:rgba(255,255,255,.12);
      color:white;
      font-size:18px;
      cursor:pointer;
    }

    .btn:hover{
      background:rgba(255,255,255,.2);
    }

    .track-info{
      min-width:180px;
    }

    .track-title{
      font-size:14px;
      font-weight:600;
    }

    .track-artist{
      font-size:11px;
      color:rgba(255,255,255,.7);
    }
  </style>
</head>
<body>

  <div class="bg"></div>

  <div class="player">

    <button class="playlist-toggle" id="playlistToggle">☰</button>

    <div class="playlist-panel" id="playlistPanel">
      <div id="playlist"></div>
    </div>

    <div class="mini-player">
      <button class="btn" id="prev">⏮</button>
      <button class="btn" id="play">▶</button>
      <button class="btn" id="next">⏭</button>

      <div class="track-info">
        <div class="track-title" id="title">Loading...</div>
        <div class="track-artist">Your Playlist</div>
      </div>
    </div>

  </div>

  <audio id="audio"></audio>

  <script>
    const songs = [
      { title: "Nostalgia Track 1", file: "song1.mp3" },
      { title: "Maar Dala", file: "song2.mp3" },
      { title: "Nostalgia Track 3", file: "song3.mp3" }
    ];

    const audio = document.getElementById('audio');
    const title = document.getElementById('title');
    const playBtn = document.getElementById('play');
    const prevBtn = document.getElementById('prev');
    const nextBtn = document.getElementById('next');
    const playlist = document.getElementById('playlist');
    const playlistToggle = document.getElementById('playlistToggle');
    const playlistPanel = document.getElementById('playlistPanel');

    let index = 0;

    function renderPlaylist(){
      playlist.innerHTML = '';
      songs.forEach((song,i)=>{
        const div = document.createElement('div');
        div.className = 'song' + (i===index ? ' active' : '');
        div.textContent = song.title;
        div.onclick = ()=>{
          index = i;
          loadSong();
          audio.play();
          playlistPanel.classList.remove('open');
        };
        playlist.appendChild(div);
      });
    }

    function loadSong(){
      audio.src = songs[index].file;
      title.textContent = songs[index].title;
      renderPlaylist();
    }

    playBtn.onclick = ()=>{
      if(audio.paused){
        audio.play();
      }else{
        audio.pause();
      }
    };

    audio.onplay = ()=> playBtn.textContent = '⏸';
    audio.onpause = ()=> playBtn.textContent = '▶';

    nextBtn.onclick = ()=>{
      index = (index + 1) % songs.length;
      loadSong();
      audio.play();
    };

    prevBtn.onclick = ()=>{
      index = (index - 1 + songs.length) % songs.length;
      loadSong();
      audio.play();
    };

    audio.onended = ()=> nextBtn.onclick();

    playlistToggle.onclick = ()=>{
      playlistPanel.classList.toggle('open');
    };

    document.addEventListener('click',(e)=>{
      if(!playlistPanel.contains(e.target) && !playlistToggle.contains(e.target)){
        playlistPanel.classList.remove('open');
      }
    });

    loadSong();
  </script>

</body>
</html>
